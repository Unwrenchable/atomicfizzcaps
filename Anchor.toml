[features]
seeds = false
skip-lint = false

# One program id per cluster. These are not the canonical program's ids.
# Keypairs (test only, unfunded) live in programs/fizzcaps-onchain/keys/.
# Do not deploy this copy. The canonical program is in
# Unwrenchable/ATOMIC-FIZZ-CAPS-VAULT-77-WASTELAND-GPS.
[programs.localnet]
fizzcaps_onchain = "3mPuzEmF6YrMP3Lfn4qm9TY2tSKsanJDhsr6ZkSbSURP"

[programs.devnet]
fizzcaps_onchain = "9uc8Tvas9j4SYnvHYYiCbQiv7DqdzkYQU4vv5mag5bcA"

[programs.mainnet]
fizzcaps_onchain = "6DnVzBtMzQcnSUeLGX93d68WZ8cz4qwq6GQvbhhnA2s8"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 60000
upgradeable = true

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/mpl_token_metadata.so"

# Builds require exactly one cluster feature. There is no default.
#   cargo test -p fizzcaps_onchain --features localnet --lib
#   anchor build -- --features localnet
#   anchor test -- --features localnet
[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/claim_loot.ts"
