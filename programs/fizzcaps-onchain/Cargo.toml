[package]
name = "fizzcaps_onchain"
version = "0.1.0"
description = "Atomic Fizz Caps — $CAPS token + real-world loot NFT claims"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fizzcaps_onchain"

[features]
# Exactly one of localnet/devnet/mainnet must be passed on the command line.
# There is no default feature. A silent localnet default would let a mainnet
# binary accept the wrong voucher domain.
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
localnet = []
devnet = []
mainnet = []

# These silence common Anchor + solana-program check-cfg warnings (very common in 2025)
# You can remove them if you prefer #![allow(unexpected_cfgs)] in lib.rs instead
custom-heap    = []
custom-panic   = []
anchor-debug   = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"  # without metadata feature
mpl-token-metadata = "5.1.1"  # latest stable as of Dec 2025 (5.1.2 is still alpha)
solana-sdk-ids = "2.2.1"
solana-sha256-hasher = "2.3.0"

[dev-dependencies]
bincode = "1"
solana-banks-interface = "2.3"
solana-ed25519-program = "2.2"
solana-program = "2.3"
solana-program-test = "2.3"
solana-sdk = "2.3"
spl-associated-token-account = "7"
spl-token = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }